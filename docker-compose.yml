services:
  postgres:
    image: postgres:16-alpine
    container_name: uni_schedule_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schedule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schedule_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-university_schedule}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schedule} -d ${POSTGRES_DB:-university_schedule}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uni_schedule_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-schedule}:${POSTGRES_PASSWORD:-schedule_dev_password}@postgres:5432/${POSTGRES_DB:-university_schedule}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    container_name: uni_schedule_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-schedule}:${POSTGRES_PASSWORD:-schedule_dev_password}@postgres:5432/${POSTGRES_DB:-university_schedule}
    depends_on:
      - backend
    volumes:
      - ./apps/bot:/app
      - ./backend:/backend

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: uni_schedule_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  uploads_data:
